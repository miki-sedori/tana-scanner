<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>カメラ実力測定（棚前スキャナ v3 準備）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  #cam { position: relative; width: 100%; background: #000; }
  video { width: 100%; display: block; }
  #guide { position: absolute; left: 8%; right: 8%; top: 50%; height: 22%;
    transform: translateY(-50%); border: 2px solid #3fb950; border-radius: 6px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #000; }
  .panel { padding: 12px 14px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #7d8590; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 4px; border-bottom: 1px solid #21262d; vertical-align: top; }
  td:first-child { color: #7d8590; width: 44%; }
  td:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ok { color: #3fb950; } .ng { color: #f85149; } .warn { color: #d29922; }
  .big { font-size: 26px; font-weight: 800; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 8px;
    padding: 12px 16px; font-size: 15px; font-weight: 700; margin: 4px 4px 4px 0; }
  button.sub { background: #21262d; }
  #log { font-size: 12px; color: #7d8590; white-space: pre-wrap; line-height: 1.5;
    max-height: 180px; overflow: auto; background: #010409; padding: 8px; border-radius: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="hint">起動中…</div>
</div>

<div class="panel">
  <div class="row">
    <button id="start">カメラ起動</button>
    <button id="zoom-up" class="sub">ズーム＋</button>
    <button id="zoom-dn" class="sub">ズーム−</button>
    <button id="torch" class="sub">ライト</button>
    <button id="copy" class="sub">結果をコピー</button>
  </div>

  <h2>① このiPhoneのカメラ実力</h2>
  <table>
    <tr><td>実際に取れた解像度</td><td id="res">—</td></tr>
    <tr><td>要求して通った設定</td><td id="reqmode">—</td></tr>
    <tr><td>ハードウェアズーム</td><td id="cap-zoom">—</td></tr>
    <tr><td>ライト(torch)</td><td id="cap-torch">—</td></tr>
    <tr><td>フォーカス制御</td><td id="cap-focus">—</td></tr>
    <tr><td>解析フレームレート</td><td id="fps">—</td></tr>
  </table>

  <h2>② 読み取り実測（シールを緑の枠いっぱいに）</h2>
  <table>
    <tr><td>いま読めたコード</td><td id="code">—</td></tr>
    <tr><td class="big" style="color:#7d8590">px/モジュール</td><td class="big" id="ppm">—</td></tr>
    <tr><td>判定（2.5以上で100%）</td><td id="verdict">—</td></tr>
    <tr><td>かざしてから読めるまで</td><td id="ttf">—</td></tr>
    <tr><td>成功／試行</td><td id="hits">0 / 0</td></tr>
    <tr><td>1フレームの解析時間</td><td id="decms">—</td></tr>
  </table>

  <h2>③ ログ</h2>
  <div id="log"></div>
</div>

<script src="zxing-wasm-reader.js?v=5"></script>
<script>
(async () => {
  const VERSION = 'probe-1.0';
  const { readBarcodes, prepareZXingModule } = ZXingWASM;
  await prepareZXingModule({
    overrides: { locateFile: (f, p) => f.endsWith('.wasm') ? 'zxing_reader.wasm' : p + f },
    fireImmediately: true,
  });

  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, track = null, running = false;
  let zoom = 1, torchOn = false;
  let attempts = 0, hits = 0, firstSeenAt = 0, decSum = 0, decN = 0;
  let frames = 0, fpsAt = performance.now();

  const logs = [];
  function log(s) {
    logs.unshift(new Date().toLocaleTimeString('ja-JP') + ' ' + s);
    $('log').textContent = logs.slice(0, 40).join('\n');
  }

  // 高い解像度から順に要求して、通ったものを採用する
  const MODES = [
    { label: '4K (3840×2160)', c: { width: { ideal: 3840 }, height: { ideal: 2160 } } },
    { label: '2.5K (2560×1440)', c: { width: { ideal: 2560 }, height: { ideal: 1440 } } },
    { label: 'FHD (1920×1080)', c: { width: { ideal: 1920 }, height: { ideal: 1080 } } },
  ];

  async function start() {
    stop();
    for (const m of MODES) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: Object.assign({ facingMode: { ideal: 'environment' }, frameRate: { ideal: 30 } }, m.c),
        });
        track = stream.getVideoTracks()[0];
        const s = track.getSettings();
        // 要求した幅の8割未満しか来なかったら次の候補へ
        if (s.width && s.width >= (m.c.width.ideal * 0.8)) {
          $('reqmode').textContent = m.label + ' で成立';
          log('採用: ' + m.label + ' → 実際 ' + s.width + '×' + s.height);
          break;
        }
        log(m.label + ' 要求 → 実際 ' + s.width + '×' + s.height + '（不足なので次を試す）');
        // 下位モードでも一応保持して続行
        if (m === MODES[MODES.length - 1]) { $('reqmode').textContent = m.label + '（縮退）'; break; }
        stream.getTracks().forEach(t => t.stop());
      } catch (e) {
        log(m.label + ' 失敗: ' + (e.name || e));
      }
    }
    if (!stream) { $('hint').textContent = 'カメラを起動できません'; return; }

    video.srcObject = stream;
    await video.play();
    running = true;

    const s = track.getSettings();
    $('res').innerHTML = `<span class="${s.width >= 3000 ? 'ok' : s.width >= 1900 ? 'warn' : 'ng'}">${s.width}×${s.height}</span>`;

    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('cap-zoom').innerHTML = caps.zoom
      ? `<span class="ok">対応 ${caps.zoom.min}〜${caps.zoom.max}</span>` : '<span class="ng">非対応</span>';
    $('cap-torch').innerHTML = caps.torch ? '<span class="ok">対応</span>' : '<span class="ng">非対応</span>';
    $('cap-focus').innerHTML = caps.focusMode
      ? `<span class="ok">${(caps.focusMode || []).join(',')}</span>` : '<span class="ng">非対応</span>';
    log('capabilities: ' + JSON.stringify(Object.keys(caps)));

    // 近接にピントを合わせる（対応機種のみ）
    try {
      if ((caps.focusMode || []).includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        log('focusMode=continuous を適用');
      }
    } catch (e) { log('focus適用失敗: ' + e.name); }

    loop();
  }

  function stop() {
    running = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; track = null; }
  }

  async function setZoom(delta) {
    if (!track || !track.getCapabilities) return;
    const caps = track.getCapabilities();
    if (!caps.zoom) { log('ズーム非対応'); return; }
    zoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoom + delta));
    try { await track.applyConstraints({ advanced: [{ zoom }] }); log('zoom=' + zoom); }
    catch (e) { log('zoom失敗: ' + e.name); }
  }

  async function toggleTorch() {
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) { log('ライト非対応'); return; }
    torchOn = !torchOn;
    try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); log('torch=' + torchOn); }
    catch (e) { log('torch失敗: ' + e.name); }
  }

  // 緑枠と同じ範囲を「フル解像度のまま」切り出す（拡大しない）
  function grabROI() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const rw = Math.floor(vw * 0.84);          // 左右8%ずつ除く
    const rh = Math.floor(vh * 0.22);          // 帯の高さ
    const rx = Math.floor((vw - rw) / 2), ry = Math.floor((vh - rh) / 2);
    if (canvas.width !== rw || canvas.height !== rh) { canvas.width = rw; canvas.height = rh; }
    ctx.drawImage(video, rx, ry, rw, rh, 0, 0, rw, rh);
    return ctx.getImageData(0, 0, rw, rh);
  }

  function moduleCount(text, format) {
    // Code128：start(11)+データ(11×n)+check(11)+stop(13)
    if (format === 'Code128') {
      const n = Math.ceil(text.length / 2) + (text.length % 2 ? 1 : 0); // Code C中心＋切替分
      return 11 + 11 * n + 11 + 13;
    }
    if (format === 'EAN-13') return 95;
    return null;
  }

  async function loop() {
    if (!running) { return; }
    if (video.readyState >= 2 && video.videoWidth) {
      if (!firstSeenAt) firstSeenAt = performance.now();
      attempts++;
      const img = grabROI();
      const t0 = performance.now();
      let results = [];
      try {
        results = await readBarcodes(img, {
          formats: ['Code128', 'EAN-13'],
          tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 1,
        });
      } catch (e) {}
      const dec = performance.now() - t0;
      decSum += dec; decN++;
      if (decN % 10 === 0) $('decms').textContent = (decSum / decN).toFixed(1) + ' ms';

      frames++;
      const now = performance.now();
      if (now - fpsAt > 1000) {
        $('fps').textContent = (frames * 1000 / (now - fpsAt)).toFixed(1) + ' fps';
        frames = 0; fpsAt = now;
      }

      if (results.length) {
        const r = results[0];
        hits++;
        const ttf = Math.round(now - firstSeenAt);
        firstSeenAt = 0;
        $('code').textContent = r.text + '（' + r.format + '）';
        $('ttf').textContent = ttf + ' ms';
        $('hits').textContent = hits + ' / ' + attempts;

        // 実測 px/モジュール：読み取り位置の横幅 ÷ モジュール数
        const p = r.position;
        let ppmTxt = '—', vd = '—';
        if (p && p.topLeft && p.topRight) {
          const wpx = Math.hypot(p.topRight.x - p.topLeft.x, p.topRight.y - p.topLeft.y);
          const mods = moduleCount(r.text, r.format);
          if (mods) {
            const ppm = wpx / mods;
            ppmTxt = ppm.toFixed(2);
            const cls = ppm >= 2.5 ? 'ok' : ppm >= 2.0 ? 'warn' : 'ng';
            vd = `<span class="${cls}">${ppm >= 2.5 ? '合格（余裕あり）' : ppm >= 2.0 ? 'ギリギリ・もう少し寄って' : '不足・もっと寄って'}</span>`;
            $('hint').textContent = ppm >= 2.5 ? '✓ 読めた（' + ppm.toFixed(1) + 'px/モジュール）' : 'もっと寄って（' + ppm.toFixed(1) + 'px）';
          }
        }
        $('ppm').textContent = ppmTxt;
        $('verdict').innerHTML = vd;
        log('読取 ' + r.text + ' / ' + ppmTxt + 'px per module / ' + ttf + 'ms');
        try { new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        attempts = 0;
      } else {
        $('hits').textContent = hits + ' / ' + attempts;
        if (attempts % 30 === 0) $('hint').textContent = 'シールを緑の枠いっぱいに寄せてください';
      }
    }
    ('requestVideoFrameCallback' in HTMLVideoElement.prototype)
      ? video.requestVideoFrameCallback(() => loop())
      : setTimeout(loop, 30);
  }

  $('start').onclick = start;
  $('zoom-up').onclick = () => setZoom(0.5);
  $('zoom-dn').onclick = () => setZoom(-0.5);
  $('torch').onclick = toggleTorch;
  $('copy').onclick = () => {
    const t = ['[' + VERSION + ']',
      '解像度: ' + $('res').textContent,
      'モード: ' + $('reqmode').textContent,
      'ズーム: ' + $('cap-zoom').textContent,
      'ライト: ' + $('cap-torch').textContent,
      'フォーカス: ' + $('cap-focus').textContent,
      'fps: ' + $('fps').textContent,
      '解析: ' + $('decms').textContent,
      'px/モジュール: ' + $('ppm').textContent,
      '読取まで: ' + $('ttf').textContent,
      'コード: ' + $('code').textContent].join('\n');
    navigator.clipboard.writeText(t).then(() => alert('コピーしました。メモに貼って比べてください'));
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (!running) start(); } else stop();
  });

  log(VERSION + ' 起動');
  start();
})();
</script>
</body>
</html>
